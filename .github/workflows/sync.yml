name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: upstream-sync-next
  cancel-in-progress: true

env:
  NODE_VERSION: 24.11.1
  VERCEL_CLI_VERSION: 54.10.2

jobs:
  sync_latest_from_upstream:
    name: Sync upstream canary into next
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout next
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: next

      - name: Configure Git
        run: |
          git config --global user.name 'zhy3213-sync-bot'
          git config --global user.email 'actions@github.com'

      - name: Merge upstream canary
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/lobehub/lobe-chat.git
          git fetch --no-tags origin next
          git fetch --no-tags upstream canary
          git checkout -B next origin/next

          before_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/canary)"

          echo "before_sha=${before_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "next already contains upstream/canary at ${upstream_sha}"
            exit 0
          fi

          if ! git merge --no-edit "$upstream_sha"; then
            git status --short

            issue_body="$(mktemp)"
            {
              echo "Automatic upstream sync failed while merging \`lobehub/lobe-chat:canary\` into \`next\`."
              echo
              echo "- Target before sync: \`${before_sha}\`"
              echo "- Upstream canary: \`${upstream_sha}\`"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "Resolve locally with:"
              echo
              echo '```bash'
              echo "git fetch origin next"
              echo "git fetch https://github.com/lobehub/lobe-chat.git canary"
              echo "git checkout next"
              echo "git reset --hard origin/next"
              echo "git merge FETCH_HEAD"
              echo "# resolve conflicts"
              echo "git push origin next"
              echo '```'
            } > "$issue_body"

            existing_issue="$(
              gh issue list \
                --state open \
                --search 'Automatic upstream sync failed in:title' \
                --json number \
                --jq '.[0].number // empty' || true
            )"

            if [ -n "$existing_issue" ]; then
              gh issue comment "$existing_issue" --body-file "$issue_body" || true
            else
              gh issue create \
                --title 'Automatic upstream sync failed' \
                --body-file "$issue_body" || true
            fi

            exit 1
          fi

          after_sha="$(git rev-parse HEAD)"
          git push origin HEAD:next

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after_sha}" >> "$GITHUB_OUTPUT"
          echo "Synced upstream/canary ${upstream_sha} into next ${after_sha}"

      - name: Setup deployment environment
        if: steps.sync.outputs.changed == 'true'
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Vercel secrets
        if: steps.sync.outputs.changed == 'true'
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Pull Vercel production environment
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.sync.outputs.changed == 'true'
        id: deploy
        run: |
          url=""
          for attempt in 1 2 3; do
            echo "Vercel deploy attempt ${attempt}/3"
            if url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"; then
              break
            fi
            status="$?"
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
