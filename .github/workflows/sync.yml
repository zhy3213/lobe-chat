name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: upstream-sync-next
  cancel-in-progress: true

env:
  NODE_VERSION: 24.11.1
  VERCEL_CLI_VERSION: 54.10.2

jobs:
  sync_latest_from_upstream:
    name: Sync upstream canary into next
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout next
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: next

      - name: Configure Git
        run: |
          git config --global user.name 'zhy3213-sync-bot'
          git config --global user.email 'actions@github.com'

      - name: Merge upstream canary
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/lobehub/lobe-chat.git
          git fetch --no-tags origin next
          git fetch --no-tags upstream canary
          git checkout -B next origin/next

          before_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/canary)"

          echo "before_sha=${before_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "next already contains upstream/canary at ${upstream_sha}"
            exit 0
          fi

          if ! git merge --no-edit "$upstream_sha"; then
            echo "Merge conflicts detected; preferring upstream for application files."

            while IFS= read -r -d '' conflict_path; do
              if [ "$conflict_path" = ".github/workflows/sync.yml" ]; then
                echo "Keeping fork workflow: $conflict_path"
                git checkout --ours -- "$conflict_path"
              elif git cat-file -e "${upstream_sha}:${conflict_path}" 2>/dev/null; then
                echo "Taking upstream version: $conflict_path"
                git checkout "$upstream_sha" -- "$conflict_path"
              else
                echo "Following upstream deletion: $conflict_path"
                git rm -- "$conflict_path"
              fi
            done < <(git diff --name-only -z --diff-filter=U)

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Unresolved merge conflicts remain after applying the upstream-wins policy."
              git status --short
              exit 1
            fi

            git add -A
            git commit --no-edit
          fi

          echo "Preserving fork-owned GitHub workflows."
          while IFS= read -r -d '' workflow_path; do
            if git cat-file -e "${before_sha}:${workflow_path}" 2>/dev/null; then
              echo "Keeping fork workflow: $workflow_path"
              git checkout "$before_sha" -- "$workflow_path"
            else
              echo "Dropping upstream-added workflow: $workflow_path"
              git rm -- "$workflow_path"
            fi
          done < <(git diff --name-only -z "$before_sha" HEAD -- .github/workflows)

          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          after_sha="$(git rev-parse HEAD)"
          git push origin HEAD:next

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after_sha}" >> "$GITHUB_OUTPUT"
          echo "Synced upstream/canary ${upstream_sha} into next ${after_sha}"

      - name: Setup deployment environment
        if: steps.sync.outputs.changed == 'true'
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Vercel secrets
        if: steps.sync.outputs.changed == 'true'
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Enable Vercel large functions
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} env add VERCEL_SUPPORT_LARGE_FUNCTIONS production --value 1 --force --yes --no-sensitive --token="$VERCEL_TOKEN"

      - name: Pull Vercel production environment
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.sync.outputs.changed == 'true'
        id: deploy
        run: |
          url=""
          for attempt in 1 2 3; do
            echo "Vercel deploy attempt ${attempt}/3"
            if url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"; then
              break
            else
              status="$?"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
